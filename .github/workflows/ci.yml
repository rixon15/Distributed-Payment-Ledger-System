name: Microservices CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test, and Verify Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Amazon Corretto JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'
          java-package: jdk
          cache: 'maven'

      # ---------------------------------------------------------
      # PHASE 1: CONSUMERS GENERATE THE CONTRACTS FIRST
      # ---------------------------------------------------------
      - name: 1. Run Consumer Tests (Generate Pacts)
        run: |
          # The Ledger is the Consumer of the Payment Service's TransactionEvent
          cd ledger-service
          mvn clean test -Dtest=*ConsumerContractTest
          
          # The Payment Service is the Consumer of the Ledger's TransactionResultEvent
          cd ../payment-service
          mvn clean test -Dtest=*ConsumerContractTest

      # ---------------------------------------------------------
      # PHASE 2: PROVIDERS VERIFY THE NEWLY GENERATED CONTRACTS
      # ---------------------------------------------------------
      - name: 2. Run Provider Tests (Verify Pacts)
        run: |
          cd payment-service
          mvn test -Dtest=*ProviderContractTest
          
          cd ../ledger-service
          mvn test -Dtest=*ProviderContractTest

      # ---------------------------------------------------------
      # PHASE 3: RUN THE REST OF THE SUITE & CHECK COVERAGE
      # ---------------------------------------------------------
      # This phase spins up Testcontainers (Docker is native on this runner)
      # and runs unit, integration, and chaos tests.
      # Finally, it runs jacoco:check to enforce the 80% rule.
      - name: 3. Run Full Suite & JaCoCo Coverage (Payment Service)
        run: |
          cd payment-service
          mvn verify -Dtest=!*ContractTest

      - name: 4. Run Full Suite & JaCoCo Coverage (Ledger Service)
        run: |
          cd ledger-service
          mvn verify -Dtest=!*ContractTest

      - name: Upload JaCoCo Reports
        uses: actions/upload-artifact@v4
        if: always() # Uploads even if the build fails
        with:
          name: jacoco-coverage-reports
          path: |
            payment-service/target/site/jacoco/
            ledger-service/target/site/jacoco/