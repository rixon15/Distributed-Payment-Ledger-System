name: CI

# Full suite: the merge gate. Feature-branch pushes get the fast lane in push-checks.yml instead.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per PR/branch; a newer push cancels the older run, except on main where every commit gets a result
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Let every module finish so one red job doesn't hide failures in the others
      fail-fast: false
      matrix:
        module: [payment-service, ledger-service, authorization-service, auth-starter, gateway-service, grpc-contracts]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: corretto
          cache: maven

      # -am builds sibling modules this one depends on (e.g. grpc-contracts) without running their tests;
      # their own matrix entries test them
      - name: Build dependencies
        run: ./mvnw -B -ntp -pl "${{ matrix.module }}" -am install -DskipTests

      # Includes Pact provider verification against the committed pact files, and the JaCoCo gate
      - name: Verify
        run: ./mvnw -B -ntp -pl "${{ matrix.module }}" verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.module }}
          path: ${{ matrix.module }}/target/site/jacoco/
          if-no-files-found: ignore

  pact-drift:
    name: Pact drift (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [payment-service, ledger-service]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: corretto
          cache: maven

      - name: Build dependencies
        run: ./mvnw -B -ntp -pl "${{ matrix.module }}" -am install -DskipTests

      - name: Regenerate consumer pacts
        run: ./mvnw -B -ntp -pl "${{ matrix.module }}" test -Dtest='*ConsumerContractTest'

      # Providers verify the committed files, so a consumer change without a regenerated pact would go unnoticed
      - name: Fail if committed pacts are stale
        run: |
          if ! git diff --exit-code -- "${{ matrix.module }}/src/test/resources/pacts"; then
            echo "::error::Pact files in ${{ matrix.module }} are out of date; run its *ConsumerContractTest and commit the result"
            exit 1
          fi

  # Single stable check for branch protection, so adding a module never means editing the ruleset.
  # always() matters: without it a failed dependency makes this job 'skipped', which GitHub counts as passing.
  ci-ok:
    name: CI OK
    needs: [test, pact-drift]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          [[ "${{ needs.test.result }}" == success && "${{ needs.pact-drift.result }}" == success ]]
