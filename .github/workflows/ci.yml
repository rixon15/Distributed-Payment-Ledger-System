name: Microservices CI Pipeline

on:
  push:
    branches:
      - main
      - feature/**
      - bugfix/**
      - hotfix/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test, and Verify Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Amazon Corretto JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'
          java-package: jdk
          cache: 'maven'

      # ---------------------------------------------------------
      # PHASE 1: CONSUMERS GENERATE THE CONTRACTS FIRST
      # ---------------------------------------------------------
      - name: 1. Run Consumer Tests (Generate Pacts)
        run: |
          set -euo pipefail

          cd ledger-service
          chmod +x mvnw
          ./mvnw clean test -Dtest='*ConsumerContractTest'

          cd ../payment-service
          chmod +x mvnw
          ./mvnw clean test -Dtest='*ConsumerContractTest'

      # ---------------------------------------------------------
      # PHASE 2: PROVIDERS VERIFY THE NEWLY GENERATED CONTRACTS
      # ---------------------------------------------------------
      - name: 2. Run Provider Tests (Verify Pacts)
        run: |
          set -euo pipefail

          cd payment-service
          chmod +x mvnw
          ./mvnw test -Dtest='*ProviderContractTest'

          cd ../ledger-service
          chmod +x mvnw
          ./mvnw test -Dtest='*ProviderContractTest'

      # ---------------------------------------------------------
      # PHASE 3: RUN THE REST OF THE SUITE & CHECK COVERAGE
      # ---------------------------------------------------------
      # Instead of relying on a negated Surefire pattern, we run verify
      # and exclude contract tests through Surefire system properties.
      - name: 3. Run Full Suite & JaCoCo Coverage (Payment Service)
        run: |
          set -euo pipefail

          cd payment-service
          chmod +x mvnw
          ./mvnw verify \
            -DexcludeTests='**/*ConsumerContractTest.java,**/*ProviderContractTest.java'

      - name: 4. Run Full Suite & JaCoCo Coverage (Ledger Service)
        run: |
          set -euo pipefail

          cd ledger-service
          chmod +x mvnw
          ./mvnw verify \
            -DexcludeTests='**/*ConsumerContractTest.java,**/*ProviderContractTest.java'

      - name: Upload JaCoCo Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-reports
          path: |
            payment-service/target/site/jacoco/
            ledger-service/target/site/jacoco/