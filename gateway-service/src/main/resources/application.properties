spring.application.name=gateway-service

gateway.public-base-url=${GATEWAY_PUBLIC_BASE_URL:http://localhost:8080}

spring.grpc.client.channels.auth-service.address=localhost:9090
spring.grpc.client.channels.ledger-service.address=localhost:9091
spring.grpc.client.channels.payment-service.address=localhost:9093

# Placeholder budgets, to be tuned at load-test time. Applied per call only when the call has no explicit deadline,
# so SubmitTransfer can later set its own (max_wait_ms + margin) without fighting this default.
spring.grpc.client.channels.auth-service.default-deadline=1s
spring.grpc.client.channels.ledger-service.default-deadline=2s
spring.grpc.client.channels.payment-service.default-deadline=3s

spring.data.redis.database=0
spring.data.redis.host=localhost
spring.data.redis.port=${GATEWAY_REDIS_HOST_PORT:6380}
spring.data.redis.password=${GATEWAY_REDIS_PASSWORD}