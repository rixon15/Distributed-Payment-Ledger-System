spring.config.import=optional:file:./.env[.properties], optional:file:../.env[.properties]
spring.application.name=authorization-service

spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=${POSTGRES_USER:user}
spring.datasource.password=${POSTGRES_PASSWORD:password}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false

server.port=8082
spring.threads.virtual.enabled=true

# FIXME: placeholder until the gateway service exists and hosts its own JWKS endpoint for private_key_jwt
demo-client.jwk-set-url=${DEMO_CLIENT_JWKS_URL:http://localhost:8090/jwks}

aws.region=${AWS_REGION:eu-central-1}
aws.kms.endpoint=${AWS_KMS_ENDPOINT:http://localhost:4566}

signing-key.rotation-period=${SIGNING_KEY_ROTATION_PERIOD:90d}
signing-key.retirement-grace-period=${SIGNING_KEY_RETIREMENT_GRACE_PERIOD:1d}
signing-key.rotation-check-cron=${SIGNING_KEY_ROTATION_CHECK_CRON:0 0 3 * * *}

spring.grpc.server.port=9090
# Spring gRPC's own security auto-config references a class shape that doesn't
# match this project's Spring Security OAuth2 stack, breaking context startup.
# Not needed anyway - DPoP/opaque-token validation happens manually at the gRPC
# service layer, not through Spring gRPC's security auto-config.
spring.autoconfigure.exclude=org.springframework.boot.grpc.server.autoconfigure.security.GrpcSecurityAutoConfiguration,\
org.springframework.boot.grpc.server.autoconfigure.security.OAuth2ClientAutoConfiguration,\
org.springframework.boot.grpc.server.autoconfigure.security.OAuth2ResourceServerAutoConfiguration