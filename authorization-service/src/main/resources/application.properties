spring.config.import=optional:file:./.env[.properties], optional:file:../.env[.properties]
spring.application.name=authorization-service

spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=${POSTGRES_USER:user}
spring.datasource.password=${POSTGRES_PASSWORD:password}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false

server.port=8082
spring.threads.virtual.enabled=true

# FIXME: placeholder until the gateway service exists and hosts its own JWKS endpoint for private_key_jwt
demo-client.jwk-set-url=${DEMO_CLIENT_JWKS_URL:http://localhost:8090/jwks}