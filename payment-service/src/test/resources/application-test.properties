app.rest-client.connect-timeout-ms=500
app.rest-client.read-timeout-ms=500

# DB fail-fast under latency/cut
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000

# Validate connections before acquiring from pool ? evicts dead connections faster
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.idle-timeout=10000

spring.kafka.listener.ack-mode=record
spring.kafka.consumer.auto-offset-reset=earliest